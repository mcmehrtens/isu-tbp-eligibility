[project]
name = "tbp-eligibility"
version = "0.1.0"
description = "Prepare the Tau Beta Pi Report of Eligibility from ISU enrollment spreadsheets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1,<4",        # read/write .xlsx
    "msoffcrypto-tool>=5,<7",  # decrypt password-protected .xlsx
    "xlrd>=2,<3",              # read .xls (TBP template format)
]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
